<!DOCTYPE html>
            <html>
                <head>
                    <meta name="algolia-site-verification" content="6AD13C48C02990F8" />
                    <title>Algolia Verification</title>
                  <!-- DocSearch CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@docsearch/css@4" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@docsearch/css@4.6.3/dist/sidepanel.css" />
    </head>
                <body>  <!-- DocSearch JS -->
    <script src="https://cdn.jsdelivr.net/npm/@docsearch/js@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@docsearch/sidepanel-js@4.6.3"></script>
    <script>
    document.querySelectorAll('.docsearch-container').forEach((container) => {
      docsearch({
        container: container,
        appId: 'XMDO29FL1L',
        apiKey: '51f9c4cfd6c2249e8fbde1a6499c641a',
        indexName: 'portfolio_site',
        insights: true,
        searchParameters: {
          facetFilters: ['lang:en']
        }
      });
    });

    // Initialize Ask AI side panel
    let sidepanelInstance = null;
    if (typeof docsearchSidepanel !== 'undefined') {
      const sidepanelDiv = document.createElement('div');
      sidepanelDiv.id = 'docsearch-sidepanel';
      document.body.appendChild(sidepanelDiv);
      
      sidepanelInstance = docsearchSidepanel({
        container: '#docsearch-sidepanel',
        indexName: 'portfolio_site',
        appId: 'XMDO29FL1L',
        apiKey: '51f9c4cfd6c2249e8fbde1a6499c641a',
        assistantId: '0d70cdeb-2ec6-467f-b028-e51427f5a159',
      });
    }

    // Emulate Docusaurus SearchBar layout exactly for desktop
    const desktopContainers = Array.from(document.querySelectorAll('.docsearch-container')).filter(container => !container.closest('nav.d-lg-none'));
    desktopContainers.forEach(container => {
      const interval = setInterval(() => {
        const btn = container.querySelector('.DocSearch-Button');
        if (btn) {
          clearInterval(interval);
          // Wrap button in DocSearch-SearchBar div
          const wrapper = document.createElement('div');
          wrapper.className = 'DocSearch-SearchBar';
          btn.parentNode.insertBefore(wrapper, btn);
          wrapper.appendChild(btn);
        }
      }, 50);
    });
  </script>
  </body>
            </html>
