<!DOCTYPE html>
            <html>
                <head>
                    <meta name="algolia-site-verification" content="6AD13C48C02990F8" />
                    <title>Algolia Verification</title>
                  <!-- DocSearch CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@docsearch/css@4" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@docsearch/css@4.6.3/dist/sidepanel.css" />
  <style>
    /* Force hide the default Algolia floating sidepanel button globally */
    .DocSearch-SidepanelButton.floating {
      display: none !important;
    }
  </style>
    </head>
                <body>  <!-- DocSearch JS -->
    <script src="https://cdn.jsdelivr.net/npm/@docsearch/js@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@docsearch/sidepanel-js@4.6.3"></script>
    <script>
    document.querySelectorAll('.docsearch-container').forEach((container) => {
      docsearch({
        container: container,
        appId: 'XMDO29FL1L',
        apiKey: '51f9c4cfd6c2249e8fbde1a6499c641a',
        indexName: 'portfolio_site',
        insights: true,
        searchParameters: {
          facetFilters: ['lang:en']
        }
      });
    });

    // Initialize Ask AI side panel
    let sidepanelInstance = null;
    if (typeof docsearchSidepanel !== 'undefined') {
      const sidepanelDiv = document.createElement('div');
      sidepanelDiv.id = 'docsearch-sidepanel';
      document.body.appendChild(sidepanelDiv);
      
      sidepanelInstance = docsearchSidepanel({
        container: '#docsearch-sidepanel',
        indexName: 'portfolio_site',
        appId: 'XMDO29FL1L',
        apiKey: '51f9c4cfd6c2249e8fbde1a6499c641a',
        assistantId: '0d70cdeb-2ec6-467f-b028-e51427f5a159',
        agentStudio: true,
        searchParameters: {},
        showButton: false,
        button: false,
        variant: 'inline',
      });
    }

    // Emulate Docusaurus SearchBar layout exactly for desktop and add Ask AI button
    const desktopContainers = Array.from(document.querySelectorAll('.docsearch-container')).filter(container => !container.closest('.d-lg-none'));
    desktopContainers.forEach(container => {
      const interval = setInterval(() => {
        const btn = container.querySelector('.DocSearch-Button');
        if (btn) {
          clearInterval(interval);
          // Wrap button in DocSearch-SearchBar div
          const wrapper = document.createElement('div');
          wrapper.className = 'DocSearch-SearchBar';
          btn.parentNode.insertBefore(wrapper, btn);
          wrapper.appendChild(btn);
          
          const askAiBtn = document.createElement('button');
          askAiBtn.className = 'DocSearch-SidepanelButton inline';
          askAiBtn.type = 'button';
          askAiBtn.setAttribute('aria-label', 'Ask AI (Control+i)');
          askAiBtn.setAttribute('aria-keyshortcuts', 'Control+i');
          askAiBtn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" class="DocSearch-Hit-icon-sparkles "><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"></path><path d="M20 3v4"></path><path d="M22 5h-4"></path><path d="M4 17v2"></path><path d="M5 18H3"></path></svg>`;
          
          askAiBtn.addEventListener('click', (e) => {
            e.preventDefault();
            if (sidepanelInstance) {
              sidepanelInstance.open();
            } else {
              btn.click();
            }
          });
          
          wrapper.appendChild(askAiBtn);
        }
      }, 50);
    });
  
    // Append Docusaurus Ask AI side panel button for mobile only
    const mobileContainers = Array.from(document.querySelectorAll('.d-lg-none .docsearch-container'));
    mobileContainers.forEach(container => {
      const interval = setInterval(() => {
        const btn = container.querySelector('.DocSearch-Button');
        if (btn) {
          clearInterval(interval);
          const wrapper = document.createElement('div');
          wrapper.className = 'DocSearch-SearchBar';
          btn.parentNode.insertBefore(wrapper, btn);
          wrapper.appendChild(btn);
          
          const askAiBtn = document.createElement('button');
          askAiBtn.className = 'DocSearch-SidepanelButton inline';
          askAiBtn.type = 'button';
          askAiBtn.setAttribute('aria-label', 'Ask AI (Control+i)');
          askAiBtn.setAttribute('aria-keyshortcuts', 'Control+i');
          askAiBtn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" class="DocSearch-Hit-icon-sparkles "><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"></path><path d="M20 3v4"></path><path d="M22 5h-4"></path><path d="M4 17v2"></path><path d="M5 18H3"></path></svg>`;
          
          askAiBtn.addEventListener('click', (e) => {
            e.preventDefault();
            if (sidepanelInstance) {
              sidepanelInstance.open();
            } else {
              btn.click();
            }
          });
          
          wrapper.appendChild(askAiBtn);
        }
      }, 50);
    });

    // Mobile search close fix — hides mobile search buttons while modal is open, revealing the native X button
    (function () {
      var mobileSearchContainer = document.querySelector('.mobile-nav-search-container');
      function showSearchButtons() { if (mobileSearchContainer) mobileSearchContainer.style.visibility = 'visible'; }
      function hideSearchButtons() { if (mobileSearchContainer) mobileSearchContainer.style.visibility = 'hidden'; }
      var closeObserver = new MutationObserver(function () {
        if (document.querySelector('.DocSearch-Modal')) { hideSearchButtons(); } else { showSearchButtons(); }
      });
      closeObserver.observe(document.body, { childList: true, subtree: true });
    })();

  </script>
  </body>
            </html>
