# Vale Configuration File
#
# Ported from the Docusaurus portal's .vale.ini and retargeted to plain HTML.
# The prose section keys on the HTML glob rather than the Markdown globs, and
# three settings exist only because this site serves static HTML:
#
#   StylesPath - the Docusaurus config uses `styles`, and this repo already has
#     a `styles/` folder holding CSS. A relative StylesPath would hand Vale a
#     directory of stylesheets, so the packages live in `.vale/styles` instead.
#
#   IgnoredScopes and BlockIgnores - Vale reads the raw bytes of an HTML page,
#     so the head, the navbar, and the footer arrive as prose. Each holds one
#     template string repeated on all six pages, and no writer edits those in
#     place. Both options drop those regions and leave body copy.
#
# Note for future edits: keep glob syntax out of these comments. Vale's parser
# treats a bracketed glob anywhere in the file, comments included, as the start
# of a syntax section, and every core option after it then fails validation.

StylesPath = .vale/styles

Packages = Microsoft, proselint, write-good, alex, Hugo, MDX, Google, https://github.com/vale-cli/Std/releases/latest/download/Std.zip, https://github.com/jdkato/voices/releases/latest/download/Voices.zip, ai-tells, A11y

MinAlertLevel = suggestion

# The proper nouns this portfolio repeats: Sweepy, Datadog, Algolia, Docusaurus,
# SuiClient, Galileo, OAuth, Petstore, and twenty-odd more. The list is Vale's
# vocabulary mechanism, not a style, so it loads with a core key rather than
# through BasedOnStyles. Vale reads it from `config/vocabularies/<Name>/` inside
# StylesPath, not from the older `Vocab/<Name>/` folder the Docusaurus repo uses.
# `Voices` stays listed so the Voices package keeps its React terms.
Vocab = Portfolio, Voices

# Inline and block scopes that never hold prose. The first six keep Vale's own
# defaults; the rest are this site's chrome.
IgnoredScopes = tt, code, pre, script, style, kbd, samp, head, nav, footer, svg, noscript

# Baseline for every file Vale reads.
[*]
BasedOnStyles = Microsoft, Google, proselint, write-good, alex, Std, Voices, Direct, ai-tells, A11y

# Spelling reads the Portfolio vocabulary above. On, so the list does its job:
# product names pass, typos stop.
Vale.Spelling = YES

# One-Breath rule: 25 words per sentence.
Direct.Length = suggestion
Direct.Ease = error

# The HTML glob, written long rather than short. A longer glob outranks a
# shorter one, and the Voices package ships a config fragment for Markdown that
# would otherwise starve this list. The long form also reaches the six
# localized folders, which inherit the same baseline as English.
[**/*.html]
BasedOnStyles = Microsoft, Google, proselint, write-good, alex, Std, Voices, Direct, ai-tells, A11y
proselint.Diacritical = NO

# BlockIgnores is syntax-specific, so it belongs in this section rather than at
# the top of the file. Each pattern cuts a template region out of the raw file
# before Vale reads it. The whitespace prefix absorbs the indentation the pages
# use, and the inline flag lets a pattern span lines.
BlockIgnores = (?s) *(<head\b.*?</head>), \
(?s) *(<nav\b.*?</nav>), \
(?s) *(<footer\b.*?</footer>), \
(?s) *(<script\b.*?</script>), \
(?s) *(<style\b.*?</style>), \
(?s) *(<svg\b.*?</svg>)

# Direct.Ease stays out of this section on purpose. A key declared twice in one
# section keeps its first value, so the level lives once, in the house style
# block below, where a later section can still override it per page.

# Std Library rule levels (https://github.com/vale-cli/Std). These lines sit in
# the prose section on purpose. An explicit level enables a rule, so the same
# block under a section that matches every file re-enables Std rules for the
# SVG and PNG assets and puts the binary noise back.
#
# Acronyms and the first-person rules stay out of this block. An explicit level
# enables a rule and beats a later `= NO` in the same section, so listing them
# here would undo the house style below.
Std.Abbreviations.Latin = suggestion
Std.DateTime.DateFormat = suggestion
Std.DateTime.TimeFormat = suggestion
Std.Grammar.Contractions = suggestion
Std.Grammar.PassiveVoice = suggestion
Std.Punctuation.OxfordComma = warning
Std.Punctuation.Ellipses = suggestion
Std.Punctuation.Spacing = warning
Std.Readability.SentenceLength = warning
Std.Usage.GenderedPronouns = suggestion
Std.Usage.GenderedTerms = suggestion



# ---------------------------------------------------------------------------
# House style for the whole site
#
# The site speaks in first person, names its tools in acronyms the audience
# already knows, and titles its cards in Title Case. None of those is a defect
# a writer can fix, so the rules go off here rather than turning into 800
# findings on every run.
# ---------------------------------------------------------------------------

# A portfolio says "I". The narrative rules ban the voice the pages are written
# in, and E-Prime bans every form of "to be", which no About page survives.
write-good.E-Prime = NO
Google.FirstPerson = NO
Microsoft.FirstPerson = NO
Google.We = NO
Microsoft.We = NO
Std.Usage.FirstPersonSingular = NO
Std.Usage.FirstPersonPlural = NO

# Skills grids, product names, and sample titles: HTML, CSS, API, SDK, MCP,
# ADA, PNR, NY, MIT. A reader of a developer portfolio defines none of them.
Google.Acronyms = NO
Microsoft.Acronyms = NO
Std.Abbreviations.Acronyms = NO
Microsoft.HeadingAcronyms = NO

# Card titles use Title Case on every page. This is the site convention, and it
# covers product names such as "InnoGear Aromatherapy Diffuser User Manual".
Google.Headings = NO
Microsoft.Headings = NO
Google.HeadingPunctuation = NO
Microsoft.HeadingPunctuation = NO

# Flesch counts syllables. Every page carries product names, version strings,
# and sample titles that sink the score regardless of clarity, so the rule
# reports at suggestion level instead of blocking a commit.
Direct.Ease = suggestion

# Parentheses carry spec data here: "(14 chars)", "(GitHub, GitLab)",
# "(Contract)", "(SPHC30/36)", "(COVID-19)". Google's rule reads every one as
# excessive.
Google.Parens = NO

# alex keeps "poverty", "breast", "disease", and "failure" on its profanity
# lists. Those words are the subject matter of the articles and the hardware
# manuals.
alex.ProfanityUnlikely = NO
alex.ProfanityMaybe = NO
alex.ProfanityLikely = NO

# Microcopy samples hold the copy under review, not copy written to house
# style. "YOUR CARD IS EXPIRED!" and "we have" are quoted drafts with a note
# explaining why each one fails, and the Knicks band repeats a phrase on
# purpose.
proselint.Exclamation = NO
Google.Exclamation = NO
Microsoft.ExclamationPoints = NO
Microsoft.Uppercase = NO
Microsoft.Contractions = NO
Google.Contractions = NO



# ---------------------------------------------------------------------------
# Repository Markdown
#
# README.md describes the site rather than appearing on it, so it gets the same
# house style and none of the page sections. BasedOnStyles is restated because
# a section's list replaces the list above it rather than adding to it.
# ---------------------------------------------------------------------------
[**/*.md]
BasedOnStyles = Microsoft, Google, proselint, write-good, alex, Std, Voices, Direct, ai-tells, A11y
write-good.E-Prime = NO
Google.FirstPerson = NO
Microsoft.FirstPerson = NO
Google.We = NO
Microsoft.We = NO
Std.Usage.FirstPersonSingular = NO
Std.Usage.FirstPersonPlural = NO
Google.Acronyms = NO
Microsoft.Acronyms = NO
Std.Abbreviations.Acronyms = NO
Microsoft.HeadingAcronyms = NO
Google.Headings = NO
Microsoft.Headings = NO
Direct.Ease = suggestion
Google.Parens = NO
alex.ProfanityUnlikely = NO
alex.ProfanityMaybe = NO
alex.ProfanityLikely = NO



# ---------------------------------------------------------------------------
# Term exceptions
#
# Every section below keys on a pattern the page establishes. A run-in bold
# label opens a term list, a quoted draft shows copy that failed, and a card
# headline repeats a publication title. No rewrite clears those, so the rule
# goes off and the structural ai-tells rules stay on.
# ---------------------------------------------------------------------------

# The skills grid is a definition list built from bold labels, such as
# "Systems &amp; QA:" followed by a term run. The ai-tells rule header names
# this exact case as a known limitation of its token, the mobile accordion
# repeats the same markup, and Google.Colons reads it the same way.
[**/aboutme.html]
ai-tells.ColonUsage = NO
Google.Colons = NO
Google.WordList = NO
Google.ExcessiveClaims = NO
write-good.TooWordy = NO
Microsoft.Vocab = NO
alex.Condescending = NO

# Each case study states a constraint as a label and value pair ("headline: 30
# characters max"), then quotes the rejected draft. Both are samples, and the
# page already brackets the draft list with inline directives.
[**/uxwriting.html]
ai-tells.ColonUsage = NO
Google.Colons = NO
ai-tells.NounString = NO
Google.Timeless = NO
Std.Grammar.Contractions = NO
write-good.TooWordy = NO
Microsoft.Vocab = NO

# Card titles use Title Case, the same decision that turns Google.Headings off
# above, so the capitalized "Email" in "Incorrect Email Error Message" is house
# style rather than a word-list error. That one card carries an inline pair
# instead of a page-wide disable, which keeps the rule live on the body copy
# where "email" and "e-mail" actually matter.

# The article cards carry published headlines. A subtitle after a colon is the
# publication's title, not a rhetorical reveal.
[**/articles.html]
Google.Colons = NO
write-good.TooWordy = NO
Microsoft.Vocab = NO

# The sample library names products and file names. write-good asks for "buy"
# where a manual says "purchase", and the vocab list flags every product noun.
[**/technical-writing-hardware.html]
write-good.TooWordy = NO
Microsoft.Vocab = NO

# The homepage hero reads "I just really like words." Two adverb rules reach
# for that line, and "sample" is the page's own word for every card it shows.
[**/index.html]
write-good.TooWordy = NO
write-good.Adverbs = NO
Microsoft.Adverbs = NO
Microsoft.Vocab = NO

# The search page holds a DocSearch verification token and no prose, so Flesch
# has nothing to score and the sentence-length rules have nothing to measure.
[**/search.html]
Direct.Ease = NO
Direct.Length = NO



# ---------------------------------------------------------------------------
# Translations
#
# Six locales. Direct.Ease is Flesch, which scores Japanese prose at -49.
# ai-tells.NounString and VerbTricolon tag English parts of speech and read
# ordinary Spanish and French as a noun stack. The typography rules read the
# target language's quote glyphs, spacing, and acronyms as defects, and
# proselint alone fires 4,589 times on curly quotes. Direct.Length and
# Std.Readability.SentenceLength stay on because word counting holds in every
# language.
# ---------------------------------------------------------------------------
# One section with a brace glob, not six stacked headers. In INI syntax a key
# belongs to the most recent header, so six back-to-back headers would leave
# five locales with no exceptions at all.
[{ar,es,fr,hi,ja,zh}/*.html]
Direct.Ease = NO
ai-tells.NounString = NO
ai-tells.VerbTricolon = NO
alex.ProfanityUnlikely = NO
alex.ProfanityMaybe = NO
alex.ProfanityLikely = NO
proselint.CurlyQuotes = NO
proselint.LexicalIllusions = NO
Google.Quotes = NO
Microsoft.Quotes = NO
Google.Colons = NO
Google.Spacing = NO
Microsoft.Spacing = NO
Std.Punctuation.Spacing = NO
Google.Ellipses = NO
Google.Semicolons = NO
Microsoft.Semicolon = NO



# ---------------------------------------------------------------------------
# Format exceptions
# ---------------------------------------------------------------------------

# Vale reads an SVG as HTML, so it flags quote placement, exclamation marks,
# and number-unit spacing inside path data. No writer edit clears those.
[*.svg]
BasedOnStyles =

# A PNG reaches the parser as binary payload read as prose, and a PDF arrives
# as compressed bytes. Both stay unreported.
[*.{png,jpg,jpeg,gif,webp}]
BasedOnStyles =

[*.pdf]
BasedOnStyles =
